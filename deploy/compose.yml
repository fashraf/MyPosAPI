# One environment (staging or production) of MyPOS on any Linux server with Docker.
# The server only needs: Docker, this file, a .env next to it, and the scripts in /opt/mypos/bin.
# Nothing here mentions an IP address: moving servers = run setup on the new box + change DEPLOY_HOST in GitHub.
name: mypos-${ENV_NAME}

services:
  db:
    image: ${DB_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      TZ: Asia/Riyadh
    volumes:
      - dbdata:/var/opt/mssql
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    image: ${API_IMAGE}:${API_TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNET_ENV:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PosMain: "Server=db;Database=${DB_NAME};User Id=${APP_DB_USER};Password=${APP_DB_PASSWORD};TrustServerCertificate=true;Encrypt=true;Application Name=MyPosApi"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: ${PUBLIC_URL}
      APP_VERSION: ${API_TAG}
      TZ: Asia/Riyadh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}:${WEB_TAG}
    ports:
      - "${WEB_PORT}:80"
    restart: unless-stopped

volumes:
  dbdata:
