name: Deploy API
# develop  -> build image, deploy to STAGING, then ask MyPOSFO to run the full sanity QA.
# tag v*   -> reuse the image that passed staging, wait for your approval, deploy to PRODUCTION.
# manual   -> redeploy any tag to either environment.
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [staging, production], default: staging }
      tag: { description: "Image tag to deploy (e.g. sha-1a2b3c4 or v1.4.0). Empty = build this commit.", required: false }

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mypos-api

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      environment: ${{ steps.t.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: |
          short=sha-${GITHUB_SHA::7}
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag || '' }}" >> "$GITHUB_OUTPUT"
            [[ -n "${{ inputs.tag }}" ]] || echo "tag=$short" >> "$GITHUB_OUTPUT"
            echo "build=${{ inputs.tag == '' }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"; echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"; echo "tag=$short" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ steps.t.outputs.tag }}
        if: steps.t.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Promote the image that passed staging to ${{ github.ref_name }} (no rebuild)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:sha-${GITHUB_SHA::7}"
          else
            echo "::warning::This commit was never deployed to staging; building it now."
            docker buildx build --push -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:sha-${GITHUB_SHA::7}" .
          fi

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ needs.image.outputs.environment }}   # production waits here for your Approve click
    concurrency: { group: "deploy-${{ needs.image.outputs.environment }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Connect to the server
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "SSH=ssh -i $HOME/.ssh/id -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -p ${{ secrets.DEPLOY_PORT || '22' }} ${{ secrets.DEPLOY_USER || 'root' }}@${{ secrets[format('DEPLOY_HOST_{0}', needs.image.outputs.environment)] }}" >> "$GITHUB_ENV"
      - name: Ship the deploy kit (scripts + compose file)
        run: |
          tar -C deploy -czf - . | $SSH "mkdir -p /opt/mypos/kit && tar -C /opt/mypos/kit -xzf - \
            && install -m 755 /opt/mypos/kit/bin/*.sh /opt/mypos/bin/ \
            && cp /opt/mypos/kit/compose.yml /opt/mypos/${{ needs.image.outputs.environment }}/compose.yml"
      - name: Deploy api=${{ needs.image.outputs.tag }}
        run: |
          echo "${{ secrets.MYPOS_BOT_TOKEN }}" | $SSH "docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin" >/dev/null
          $SSH "DEPLOYED_BY=${{ github.actor }} /opt/mypos/bin/deploy.sh ${{ needs.image.outputs.environment }} api=${{ needs.image.outputs.tag }}"
      - name: Summary
        if: always()
        run: echo "### ${{ job.status == 'success' && '✅' || '❌' }} API ${{ needs.image.outputs.tag }} → ${{ needs.image.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the sanity QA (staging)
        if: success() && needs.image.outputs.environment == 'staging'
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.MYPOS_BOT_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/myposfo/dispatches \
            -d '{"event_type":"qa-run","client_payload":{"trigger":"MyPosAPI ${{ needs.image.outputs.tag }}","commit":"${{ github.sha }}"}}'
